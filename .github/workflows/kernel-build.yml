name: Build kernel

on:
  push:
    branches:
      - 6.18-fit-migration
      - sixteen-qpr2
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: mt6768_defconfig
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync \
            device-tree-compiler

      - name: Validate build toolchain
        run: |
          set -euxo pipefail
          clang --version
          ld.lld --version
          clang_major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n1)"
          test -n "$clang_major"
          test "$clang_major" -ge 15
          command -v flex
          command -v bison
          command -v dtc

      - name: Validate source and Android configuration
        run: |
          set -euxo pipefail
          git diff --check
          grep -q '^CONFIG_ANDROID_BINDER_IPC=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_ANDROID_BINDERFS=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_PSTORE=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_PSTORE_FTRACE=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_PSTORE_RAM=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_FTRACE=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_DM_VERITY=y$' arch/arm64/configs/mt6768_defconfig
          grep -q '^CONFIG_FS_VERITY=y$' arch/arm64/configs/mt6768_defconfig

      - name: Build merlin kernel
        env:
          ARCH: arm64
          LLVM: 1
          LLVM_IAS: 1
        run: |
          set -euxo pipefail
          make O="$GITHUB_WORKSPACE/out" mt6768_defconfig
          test -s "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_ANDROID_BINDER_IPC=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_ANDROID_BINDERFS=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_PSTORE=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_PSTORE_PMSG=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_PSTORE_RAM=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_PSTORE_FTRACE=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_FTRACE=y$' "$GITHUB_WORKSPACE/out/.config"
          grep -q '^CONFIG_ARCH_MEDIATEK=y$' "$GITHUB_WORKSPACE/out/.config"
          make O="$GITHUB_WORKSPACE/out" -j"$(nproc)" Image.gz dtbs

      - name: Verify kernel artifacts
        run: |
          set -euxo pipefail
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dts/mediatek/mt6769z-xiaomi-merlin.dtb
          file out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/dts/mediatek/mt6769z-xiaomi-merlin.dtb
          python3 - "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" "${GITHUB_SHA:0:12}" <<'PY'
          import gzip
          import re
          import sys

          image = gzip.open(sys.argv[1], "rb").read()
          match = re.search(rb"Linux version ([^\s]+)", image)
          if not match:
              raise SystemExit("Image.gz has no embedded Linux version string")
          version = match.group(1).decode()
          expected = "g" + sys.argv[2]
          if expected not in version:
              raise SystemExit(f"kernel version {version!r} does not identify this build ({expected})")
          print(f"verified kernel build identity: {version}")
          PY

      - name: Validate merlin boot DTB
        run: |
          set -euxo pipefail
          dtb="out/arch/arm64/boot/dts/mediatek/mt6769z-xiaomi-merlin.dtb"
          dts="out/mt6769z-xiaomi-merlin.generated.dts"
          dtc -I dtb -O dts -o "$dts" "$dtb"
          grep -q 'stdout-path = "serial0:921600n8"' "$dts"
          if grep -q 'bootargs' "$dts"; then
            echo 'merlin DTB must not inject bootargs; use boot image header cmdline' >&2
            exit 1
          fi
          grep -q 'ramoops@4d010000' "$dts"
          grep -q 'compatible = "ramoops"' "$dts"
          grep -q '#address-cells = <0x02>' "$dts"
          grep -q '#size-cells = <0x02>' "$dts"
          grep -q 'ranges;' "$dts"
          grep -q 'record-size = <0x20000>' "$dts"
          grep -q 'console-size = <0x40000>' "$dts"
          grep -q 'ftrace-size = <0x10000>' "$dts"
          grep -q 'pmsg-size = <0x10000>' "$dts"
          grep -q 'max-reason = <0x02>' "$dts"
          grep -q 'memory@40000000' "$dts"
          python3 - "$dts" <<'PY'
          import pathlib
          import sys

          dts = pathlib.Path(sys.argv[1]).read_text()
          start = dts.find("pwrap@1000d000 {")
          end = dts.find("\n\t\t};", start)
          if start < 0 or end < 0:
              raise SystemExit("pwrap node missing or malformed in merlin DTB")
          pwrap = dts[start:end]
          if 'compatible = "mediatek,mt6358";' not in pwrap:
              raise SystemExit("pwrap must contain its MT6358 PMIC child")
          print("validated MT6768 PWRAP -> MT6358 PMIC hierarchy")
          PY
          if grep -q 'framebuffer@7d9b0000' "$dts"; then
            echo 'invalid framebuffer reservation is present in merlin DTB' >&2
            exit 1
          fi

      - name: Validate boot artifact checksums
        run: |
          set -euxo pipefail
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dts/mediatek/mt6769z-xiaomi-merlin.dtb \
            out/.config

      - name: Package pure kernel
        run: |
          mkdir -p release/kernel/dtb
          cp out/arch/arm64/boot/Image.gz release/kernel/
          cp out/arch/arm64/boot/dts/mediatek/mt6769z-xiaomi-merlin.dtb \
            release/kernel/dtb/
          cp out/.config release/kernel/
          printf '%s\n' \
            'bootopt=64S3,32N2,64N2' \
            'androidboot.init_fatal_reboot_target=recovery' \
            'nodebugmon' \
            'noirqdebug' \
            'cgroup.memory=nokmem,nosocket' \
            'cgroup_disable=pressure' \
            'pm.sleep_mode=1' \
            'firmware_class.path=/vendor/firmware' \
            'vmalloc=400M' \
            'earlycon=mtk8250,0x11002000' \
            'console=ttyS0,921600n8' \
            'loglevel=8' \
            'printk.devkmsg=on' \
            'log_buf_len=4M' \
            'clk_ignore_unused' \
            > release/kernel/merlin-bootargs.txt
          tar -C release/kernel -czf release/merlin-kernel-${{ github.sha }}.tar.gz .

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/merlin-kernel-${{ github.sha }}.tar.gz
          tag_name: kernel-build-${{ github.sha }}
          body: |
            Merlin Android 16 kernel build
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
